<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniEventDJ</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="player-redesign.css"></head>
<body><div id="app"></div><template id="app-template">
<div class="app-shell" :class="{'sidebar-collapsed':ui.sidebarCollapsed}">
 <aside class="sidebar" aria-label="Điều hướng chính">
  <div class="sidebar-topline">
   <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
   <button type="button" class="sidebar-collapse" @click="toggleSidebar" :aria-label="ui.sidebarCollapsed ? 'Mở rộng thanh điều hướng' : 'Thu gọn thanh điều hướng'" :aria-expanded="!ui.sidebarCollapsed" :title="ui.sidebarCollapsed ? 'Mở rộng menu' : 'Thu gọn menu'">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 18-6-6 6-6"/></svg>
   </button>
  </div>
  <div class="brand"><div class="brand-mark" aria-hidden="true"><span>DJ</span></div><div class="brand-copy"><strong>MiniEventDJ</strong><small>LIVE MUSIC STUDIO</small></div></div>
  <button type="button" class="sidebar-search" @click="openLibrarySearch" title="Tìm bài hát trong thư viện (Ctrl+K)" aria-label="Tìm bài hát trong thư viện">
   <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.2 4.2"/></svg>
   <span class="search-copy">Tìm bài hát...</span><kbd class="search-shortcut">Ctrl K</kbd>
  </button>
  <div class="sidebar-nav-scroll">
   <div class="nav-label">ĐIỀU KHIỂN</div>
   <nav class="navigation" aria-label="Không gian làm việc">
    <button type="button" class="nav-item" :class="{selected:ui.page==='player' && !ui.queueFocus && !ui.eqOpen}" :aria-current="ui.page==='player' && !ui.queueFocus && !ui.eqOpen ? 'page' : null" title="Trang chủ" @click="goToHome">
     <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 10 6-10 6V6Z"/></svg></span><span class="nav-text">Trang chủ</span><span class="nav-active-dot" aria-hidden="true"></span>
    </button>
    <button type="button" class="nav-item" :class="{selected:ui.page==='player' && ui.queueFocus}" :aria-current="ui.page==='player' && ui.queueFocus ? 'page' : null" title="Hàng chờ phát" @click="goToQueue">
     <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h8"/><path d="m3 5 2 1.5L3 8M3 11l2 1.5L3 14M3 17l2 1.5L3 20"/></svg></span><span class="nav-text">Hàng chờ phát</span><span class="nav-count">{{state.queue.length}}</span>
    </button>
   </nav>
   <div class="nav-divider"></div>
   <div class="nav-label">THƯ VIỆN & ÂM THANH</div>
   <nav class="navigation" aria-label="Thư viện và công cụ">
    <button type="button" class="nav-item" :class="{selected:ui.page==='library'}" :aria-current="ui.page==='library' ? 'page' : null" title="Thư viện nhạc" @click="setPage('library')">
     <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18m-12 5h6"/></svg></span><span class="nav-text">Thư viện nhạc</span><span class="nav-count">{{state.library.length}}</span>
    </button>
    <button type="button" class="nav-item" :class="{selected:ui.eqOpen}" :aria-current="ui.eqOpen ? 'page' : null" title="Equalizer âm thanh" @click="openEq($event)">
     <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6v12m5-15v18m5-15v12m5-15v18"/><circle cx="4" cy="10" r="2" fill="currentColor" stroke="none"/><circle cx="9" cy="16" r="2" fill="currentColor" stroke="none"/><circle cx="14" cy="10" r="2" fill="currentColor" stroke="none"/><circle cx="19" cy="8" r="2" fill="currentColor" stroke="none"/></svg></span><span class="nav-text">Equalizer</span><span class="nav-bullet" aria-hidden="true"></span>
    </button>
   </nav>
   <div class="nav-divider"></div>
   <div class="nav-label">ỨNG DỤNG</div>
   <nav class="navigation" aria-label="Hệ thống">

    <button type="button" class="nav-item" :class="{selected:ui.page==='settings'}" :aria-current="ui.page==='settings' ? 'page' : null" title="Cài đặt" @click="setPage('settings')">
     <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3h3.4l.6 2.2 1.7.9 2.2-.6 1.8 2.9-1.6 1.6v2l1.6 1.6-1.8 2.9-2.2-.6-1.7.9-.6 2.2h-3.4l-.6-2.2-1.7-.9-2.2.6-1.8-2.9L5.6 12v-2L4 8.4l1.8-2.9 2.2.6 1.7-.9L10.3 3Z"/><circle cx="12" cy="11" r="2.7"/></svg></span><span class="nav-text">Cài đặt</span>
    </button>
   </nav>
  </div>
  <div class="sidebar-lower">
   <section class="sidebar-mini-player" aria-label="Trình phát nhạc thu nhỏ">
    <div class="mini-player-heading"><span class="mini-live-dot" :class="{isPlaying:state.playbackState==='playing'}"></span><span>ĐANG PHÁT</span><span class="mini-deck-label">LIVE DECK</span></div>
    <div class="mini-player-track"><div class="mini-art" aria-hidden="true"><svg viewBox="0 0 48 48" width="34" height="34"><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.3" opacity=".7"/><circle cx="24" cy="24" r="6" fill="currentColor" opacity=".75"/><circle cx="24" cy="24" r="2" fill="#19191b"/><path d="M24 5a19 19 0 0 1 19 19" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/></svg></div><div class="mini-track-meta"><strong :title="state.active?.name || 'Chưa chọn bài hát'">{{ state.active?.name || 'Chưa chọn bài hát' }}</strong><small>{{state.playbackState==='playing' ? 'Đang phát' : state.active ? 'Tạm dừng' : 'Chọn bài từ thư viện'}}</small></div></div>
    <div class="mini-progress" role="progressbar" aria-label="Tiến trình phát nhạc" :aria-valuenow="Math.round(ui.playbackProgress)" aria-valuemin="0" aria-valuemax="100"><span :style="{width:ui.playbackProgress+'%'}"></span></div>
    <div class="mini-controls"><button type="button" class="mini-play" @click="togglePlay" :disabled="!state.active && !state.queue.length" :aria-label="state.playbackState==='playing'?'Tạm dừng nhạc':'Phát nhạc'" :title="state.playbackState==='playing'?'Tạm dừng':'Phát'"><span aria-hidden="true">{{state.playbackState==='playing'?'❚❚':'▶'}}</span></button><div class="mini-time">{{ui.time}}</div><button type="button" class="mini-next" @click="playNextTrack" :disabled="!state.queue.length" aria-label="Bài tiếp theo" title="Bài tiếp theo">⏭</button></div>
   </section>
   <div class="sidebar-bottom"><span class="sd-status-light" :data-live="state.playbackState==='playing'"></span><div><b>{{ state.playbackState==='playing' ? 'HỆ THỐNG ĐANG PHÁT' : 'HỆ THỐNG SẴN SÀNG' }}</b><small>MiniEventDJ · Tauri 2</small></div></div>
  </div>
 </aside>
 <div class="workspace"><header class="topbar"><div class="breadcrumb"><span>MINIEVENT DJ</span><span class="breadcrumb-sep">/</span><b>{{ ui.page==='player' ? 'TRANG CHỦ' : ui.page==='library' ? 'THƯ VIỆN' : ui.page==='eq' ? 'EQUALIZER' : 'CÀI ĐẶT' }}</b></div><output id="status" :data-state="ui.statusKind"><i id="status-dot"></i><span id="status-text">{{ ui.status }}</span></output></header>
 <main class="content">
 <transition name="page-fade" :duration="{enter:320,leave:200}"><section class="page player-page" v-show="ui.page==='player'" aria-label="Trang chủ"><div class="page-heading"><div><div class="eyebrow">LIVE MUSIC / ĐIỀU KHIỂN</div><h1>Trang <span>chủ</span></h1><p>Điều khiển âm thanh và theo dõi bài hát tiếp theo.</p></div><button class="quiet-button" @click="setPage('library')">THƯ VIỆN <span>↗</span></button></div>
 <div class="player-grid"><section class="deck-card deck-card-redesign">
  <div class="section-head"><div><i></i><h2>ĐANG PHÁT</h2></div></div>
  <div class="deck-main">
   <div class="deck-primary">
    <div class="deck-track-hero">
      <div class="deck-track-meta"><small id="waveform-mode">BÀI HÁT HIỆN TẠI</small><h3 id="track-title" :title="state.active?.name || 'Chưa chọn bài hát'">{{state.active?.name || 'Chưa chọn bài hát'}}</h3></div>
    </div>
    <!-- One shared seek region: true waveform OR standard progress, never both. -->
    <div class="wave-wrap full-track-wave" v-show="!!state.activeAnalysis?.peaks?.length"><canvas id="waveform" aria-label="Sóng âm toàn bài, nhấn hoặc kéo để tua"></canvas></div>
    <div v-if="!state.activeAnalysis?.peaks?.length" class="long-track-progress compact-wave-fallback" :class="{ 'progress-disabled': !state.active }" role="slider" tabindex="0" aria-label="Tiến trình bài đang phát, nhấn hoặc kéo để tua" :aria-valuenow="Math.round(ui.playbackProgress)" aria-valuemin="0" aria-valuemax="100" @pointerdown="beginLongTrackSeek" @pointermove="moveLongTrackSeek" @pointerup="endLongTrackSeek" @pointercancel="cancelLongTrackSeek" @keydown.left.prevent="seekActiveBy(-5)" @keydown.right.prevent="seekActiveBy(5)" @keydown.home.prevent="seekLongTrackTo(0)" @keydown.end.prevent="seekLongTrackTo(1)"><div class="long-track-progress-fill" :style="{width:ui.playbackProgress+'%'}"></div></div>
    <div class="transport-row"><div class="transport" aria-label="Điều khiển phát nhạc">
     <div class="transport-actions"><button id="stop" class="transport-action restart-action" @click="restartTrack" aria-label="Phát lại từ đầu bài" title="Từ đầu"><span aria-hidden="true">↺</span><b>Từ đầu</b></button><button id="repeat-current" class="transport-action repeat-action" :class="{active:!!state.active?.repeat}" @click="toggleRepeat" :aria-label="state.active?.repeat ? 'Đang lặp bài hát' : 'Lặp bài hát'" title="Lặp bài"><span aria-hidden="true">↻</span><b>Lặp</b></button></div>
     <div class="transport-main"><button id="previous-track" class="transport-skip" @click="playPreviousTrack" :disabled="!state.queue.length" aria-label="Bài trước" title="Phát bài trước"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M5 5h2v14H5zM19 5v14L8 12z"/></svg></button>
     <button id="play" class="primary icon-button play-toggle" :class="{active:state.playbackState==='playing'}" @click="togglePlay" :aria-label="state.playbackState==='playing'?'Tạm dừng':'Phát'" title="Phát / Tạm dừng"><span :class="state.playbackState==='playing'?'pause-symbol':'play-symbol'"></span></button>
     <button id="next-track" class="transport-skip" @click="playNextTrack" :disabled="!state.queue.length" aria-label="Bài sau" title="Phát bài sau"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5v14l11-7z"/></svg></button></div>
    </div></div>
    <div class="deck-adjustments">
     <div class="tempo-group" aria-label="Điều chỉnh tốc độ phát">
       <div class="control-heading tempo-heading"><span class="control-caption"><svg class="tempo-gauge-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 16 4-6"/><circle cx="12" cy="16" r="1" fill="currentColor"/></svg>TỐC ĐỘ PHÁT</span><strong id="tempo-value">{{state.tempo.toFixed(1)}}%</strong></div>
       <div class="tempo-slider-row"><button id="tempo-down" aria-label="Giảm tốc độ 1%" @click="setTempo(state.tempo-1)" title="Giảm tốc độ 1%">−</button><input id="tempo" type="range" min="80" max="120" :value="state.tempo" @input="setTempo(+$event.target.value)" aria-label="Tốc độ phát"><button id="tempo-up" aria-label="Tăng tốc độ 1%" @click="setTempo(state.tempo+1)" title="Tăng tốc độ 1%">+</button><button id="tempo-reset" class="tempo-reset" aria-label="Đặt lại tốc độ phát" @click="setTempo(100)" title="Khôi phục tốc độ 100%">↺</button><span class="metric bpm" title="Nhịp bài hát (BPM)"><small>BPM</small><strong id="bpm-value">{{state.activeAnalysis?.bpm ? state.activeAnalysis.bpm.toFixed(1) : (state.active?.bpm ? state.active.bpm.toFixed(1) : '--')}}</strong></span></div>
     </div>
     <label class="volume-control"><span class="volume-title"><svg class="volume-speaker-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg>ÂM LƯỢNG TỔNG</span><strong>{{state.masterVolume}}%</strong><input id="master-volume" type="range" min="0" max="100" :value="state.masterVolume" @input="setMasterVolume($event.target.value)" aria-label="Âm lượng tổng"></label>
    </div>
   </div>
   <aside class="meter-wrap" title="Stereo L/R: 0–70% vạch trắng, trên 70% vạch đỏ báo vùng tín hiệu cao"><div class="stereo-title">◖◗ &nbsp; STEREO OUTPUT</div><div class="channel-labels"><i>L</i><i>R</i></div><canvas id="meter" width="104" height="118" aria-label="Hai dải âm lượng L/R, 70 phần trăm màu trắng và 30 phần trăm vùng cảnh báo màu đỏ"></canvas></aside>
  </div>
 </section>
 <aside class="player-side"><section class="preview-card"><div class="section-head"><div><i></i><h2>XEM TRƯỚC</h2></div><span class="meta-label">NEXT TRACK</span></div><div class="track-heading preview-heading"><div><small>BÀI KẾ TIẾP</small><h3 id="preview-title">{{ previewTrack?.name || 'Chưa chọn bài tiếp theo' }}</h3></div><time id="preview-time">{{ ui.previewTime }}</time></div><div class="preview-wave-wrap" v-show="!!state.previewAnalysis?.peaks?.length"><canvas id="preview-waveform" aria-label="Sóng âm xem trước: nhấn để đặt điểm phát"></canvas><div id="empty-preview-placeholder" class="empty-wave-message" :class="{hidden: !!previewTrack}">Chọn bài trong hàng chờ</div></div><div id="preview-long-track" v-show="!state.previewAnalysis?.peaks?.length" class="long-track-progress preview-long-track" role="slider" tabindex="0" aria-label="Điểm phát bài nghe thử" :aria-valuenow="Math.round(ui.previewProgress)" aria-valuemin="0" aria-valuemax="100"><div class="long-track-progress-fill" :style="{width:ui.previewProgress+'%'}"></div></div><button class="preview-listen" @click="togglePreview" :disabled="!previewTrack">{{ui.previewPlaying ? "❚❚ DỪNG NGHE THỬ" : "▶ NGHE THỬ BÀI KẾ TIẾP"}}</button><label class="preview-volume"><span>ÂM LƯỢNG NGHE THỬ</span><strong>{{state.previewVolume}}%</strong><input type="range" min="0" max="100" :value="state.previewVolume" @input="setPreviewVolume($event.target.value)" aria-label="Âm lượng nghe thử"></label></section>
 <section class="settings-card player-eq-card" role="button" tabindex="0" aria-label="Mở trang điều chỉnh Equalizer" @click="openEq($event)" @keydown.enter.prevent="openEq($event)" @keydown.space.prevent="openEq($event)"><div class="section-head"><div><i></i><h2>EQUALIZER</h2></div></div><canvas id="player-eq-curve" aria-hidden="true"></canvas></section>
 </aside></div><section class="queue-summary player-queue-card"><div class="section-head"><div><i></i><h2>HÀNG CHỜ PHÁT</h2></div><span class="meta-label">{{state.queue.length}} BÀI</span></div><p class="queue-help">Chọn bài để xem trước · Nhấn ▶ để phát · Kéo để sắp xếp</p><input id="player-queue-search" v-model="ui.playerQueueQuery" aria-label="Tìm trong hàng chờ" placeholder="Tìm trong hàng chờ..."><queue-list id="player-queue" :items="playerQueueItems"></queue-list><div class="queue-actions"><button @click="setPage('library')">THÊM BÀI TỪ THƯ VIỆN <span>→</span></button><button @click="clearQueue" :disabled="!state.queue.length">XÓA HÀNG CHỜ</button></div></section></section></transition>
 <transition name="page-fade" :duration="{enter:320,leave:200}"><section class="page library-page" v-show="ui.page==='library'" aria-label="Thư viện và hàng chờ"><div class="page-heading"><div><div class="eyebrow">MUSIC / THƯ VIỆN</div><h1>Thư viện <span>nhạc</span></h1><p>Chọn bài và sắp xếp thứ tự phát cho sự kiện.</p></div><div class="page-tag">{{state.library.length}} BÀI TRONG THƯ VIỆN</div></div>  <section class="collections">
    <article><div class="panel-header"><div><h2>THƯ VIỆN NHẠC</h2><span id="library-count">{{ state.library.length }} bài hát</span></div><div class="library-actions"><div class="library-sort" aria-label="Sắp xếp thư viện"><button id="sort-by-date" class="sort-button" :class="{active:state.librarySort==='date'}" @click="setLibrarySort('date')" :title="state.librarySort==='date' ? 'Đảo thứ tự theo ngày thêm' : 'Sắp xếp theo ngày thêm'">NGÀY <span>{{ state.librarySort==='date' && state.librarySortDirection==='asc' ? '↑' : '↓' }}</span></button><button id="sort-by-duration" class="sort-button" :class="{active:state.librarySort==='duration'}" @click="setLibrarySort('duration')" :title="state.librarySort==='duration' ? 'Đảo thứ tự theo thời lượng' : 'Sắp xếp theo thời lượng'">ĐỘ DÀI <span>{{ state.librarySort==='duration' && state.librarySortDirection==='desc' ? '↓' : '↑' }}</span></button></div><button id="clear-library" @click="clearLibrary">Xóa tất cả</button><button id="add-files" @click="addFiles" title="Thêm nhạc">＋ Thêm nhạc</button><button id="add-folder" @click="addFolder" title="Thêm thư mục">▣ Thêm thư mục</button></div></div><input id="library-search" v-model="ui.libraryQuery" aria-label="Tìm trong thư viện nhạc" placeholder="Tìm tên bài hát..."><div id="library" class="track-list"><div v-for="row in libraryItems" :key="row.item.path" class="track library-track" :class="{selected: state.selectedLibraryTrackId === row.item.path}" draggable="true" @click="selectLibrary(row.item)" @dblclick="addToQueue([row.item])" @dragstart="dragLibrary($event,row.item)"><span class="track-index">{{ row.index }}</span><span class="track-name" :title="row.item.name">{{ row.item.name }}</span><span class="track-duration library-duration" :title="row.item.duration > 0 ? 'Thời lượng bài hát' : 'Chưa xác định thời lượng'">{{ row.item.duration > 0 ? formatTime(row.item.duration) : '--:--' }}</span><button class="pin" :title="row.item.pinned ? 'Bỏ ghim' : 'Ghim bài hát'" :aria-label="row.item.pinned ? 'Bỏ ghim bài hát' : 'Ghim bài hát'" @click.stop="pinTrack(row.item)">{{ row.item.pinned ? '♥' : '♡' }}</button></div><div v-if="!libraryItems.length" class="list-empty">Chưa có bài hát phù hợp</div></div><footer><button id="queue-selected" @click="queueSelected">Thêm vào hàng chờ</button></footer></article>
    <div id="panel-splitter" class="panel-splitter" role="separator" aria-label="Kéo để thay đổi kích thước thư viện và hàng chờ" aria-orientation="vertical" tabindex="0"></div>
    <article><div class="panel-header"><div><h2>HÀNG CHỜ PHÁT</h2><span id="queue-count">{{ state.queue.length }} bài</span></div><button id="clear-queue" @click="clearQueue">Xóa hàng chờ</button></div><input id="queue-search" v-model="ui.queueQuery" aria-label="Tìm trong hàng chờ" placeholder="Tìm trong hàng chờ..."><queue-list id="queue" :items="queueItems"></queue-list><footer>Kéo từ thư viện để chèn · Kéo lại thư viện để xóa</footer></article>
  </section></section></transition>
 <transition name="page-fade" :duration="{enter:320,leave:200}"><section class="page settings-page" v-show="ui.page==='settings'" aria-label="Cài đặt"><div class="page-heading"><div><div class="eyebrow">SYSTEM / TÙY CHỈNH</div><h1>Cài <span>đặt</span></h1><p>Điều chỉnh cách phát nhạc phù hợp với chương trình của bạn.</p></div></div><div class="settings-grid"><section class="settings-card"><div class="section-head"><div><i></i><h2>XỬ LÝ ÂM THANH</h2></div><span class="meta-label">PLAYBACK</span></div><div class="setting-row"><div><h3>Tự bỏ khoảng lặng</h3><p>Bỏ phần im lặng ở đầu và cuối bài hát khi phát.</p></div><button id="trim" @click="toggleTrim" :class="{active: state.autoTrim}" :aria-pressed="state.autoTrim">{{ state.autoTrim ? 'ĐANG BẬT' : 'ĐANG TẮT' }}</button></div><div class="setting-range"><div class="setting-range-head"><div><h3>Thời gian chuyển bài</h3><p>Áp dụng cho fade in, fade out và chuyển bài.</p></div><strong id="fade-value">{{ state.fadeDuration.toFixed(state.fadeDuration < 1 ? 2 : 1) }}s</strong></div><input id="fade-duration" :value="Math.round(state.fadeDuration * 1000)" @input="setFade($event.target.value)" aria-label="Thời gian chuyển bài" type="range" min="150" max="2000" step="50"><div class="range-labels"><span>0.15 GIÂY</span><span>2 GIÂY</span></div></div><div class="setting-range"><div class="setting-range-head"><div><h3>Giới hạn tạo sóng âm</h3><p>Bài dài hơn mức này hiển thị thanh tiến trình.</p></div><strong>{{state.waveformMinutes}} phút</strong></div><input type="range" min="1" max="30" step="1" :value="state.waveformMinutes" @change="setWaveformMinutes($event.target.value)" aria-label="Giới hạn tạo sóng âm, từ 1 đến 30 phút"><div class="range-labels"><span>1 PHÚT</span><span>30 PHÚT</span></div></div><div class="output-routing"><div class="section-head"><div><i></i><h2>NGUỒN PHÁT</h2></div><button class="text-button" :disabled="ui.outputBusy" @click="refreshOutputDevices">LÀM MỚI</button></div><p>Chọn thiết bị cho nhạc chính và nghe thử bài kế tiếp.</p><div class="output-actions"><button :disabled="ui.outputBusy" @click="requestAudioDevices">HIỆN TẤT CẢ THIẾT BỊ</button><button v-if="ui.outputPickerSupported" :disabled="ui.outputBusy" @click="pickAudioDevice">THÊM THIẾT BỊ</button></div><p class="output-permission">Để hiện danh sách, macOS có thể hỏi quyền microphone. Ứng dụng chỉ mở microphone để nhận diện thiết bị và đóng ngay sau đó, không ghi âm.</p><label>NHẠC CHÍNH<select :value="state.outputMain" :disabled="ui.outputBusy" @change="setOutput('main',$event.target.value,$event.target)"><option v-if="state.outputMain!=='default' && !ui.outputDevices.some(d=>d.id===state.outputMain)" :value="state.outputMain">Thiết bị đã lưu (chưa có trong danh sách)</option><option value="default">Loa mặc định của hệ thống</option><option v-for="device in ui.outputDevices" :key="device.id" :value="device.id">{{device.label}}</option></select></label><label>NEXT TRACK / NGHE THỬ<select :value="state.outputNext" :disabled="ui.outputBusy" @change="setOutput('next',$event.target.value,$event.target)"><option v-if="state.outputNext!=='default' && !ui.outputDevices.some(d=>d.id===state.outputNext)" :value="state.outputNext">Thiết bị đã lưu (chưa có trong danh sách)</option><option value="default">Loa mặc định của hệ thống</option><option v-for="device in ui.outputDevices" :key="device.id" :value="device.id">{{device.label}}</option></select></label><p v-if="ui.outputError" class="output-error" role="status">{{ui.outputError}}</p></div></section>
 <section class="settings-card shortcuts-card"><div class="section-head"><div><i></i><h2>PHÍM TẮT</h2></div><span class="meta-label">KEYBOARD</span></div><div class="shortcut-row"><span>Phát / tạm dừng</span><kbd>SPACE</kbd></div><div class="shortcut-row"><span>Bài tiếp theo</span><kbd>N</kbd></div><div class="shortcut-row"><span>Về đầu bài</span><kbd>R</kbd></div><div class="shortcut-row"><span>Tua bài hát</span><kbd>← / →</kbd></div><div class="shortcut-row"><span>Điều chỉnh âm lượng</span><kbd>↑ / ↓</kbd></div><div class="shortcut-row"><span>Lặp lại bài</span><kbd>L</kbd></div></section></div></section></transition>
 <transition name="modal-fade" :duration="{enter:460,leave:280}"><div v-show="ui.eqOpen" class="eq-overlay" :style="{'--eq-origin-x':ui.eqOrigin.x+'px','--eq-origin-y':ui.eqOrigin.y+'px'}" role="dialog" aria-modal="true" aria-label="Equalizer" @click.self="setPage('player')"><section class="page eq-page">

  <section class="settings-card eq-card"><div class="section-head"><div><i></i><h2>EQ CHÍNH</h2></div><span class="meta-label">PHỔ ÂM THANH / ĐÁP TUYẾN EQ</span></div>

   <label>TẦN SỐ <span>Hz</span><input type="number" min="20" max="20000" step="1" :value="state.eq.bands[ui.eqSelected].frequency" @change="setEqParameter('frequency',$event.target.value)"></label>
   <label>MỨC <span>dB</span><input type="number" min="-12" max="12" step="0.5" :disabled="['highpass','lowpass'].includes(state.eq.bands[ui.eqSelected].type)" :value="state.eq.bands[ui.eqSelected].gain" @change="setEqParameter('gain',$event.target.value)" @wheel="wheelEqParameter($event,'gain')"></label>
   <label>ĐỘ RỘNG <span>Q</span><input type="number" min="0.1" max="10" step="0.1" :disabled="['lowshelf','highshelf'].includes(state.eq.bands[ui.eqSelected].type)" :value="state.eq.bands[ui.eqSelected].q" @change="setEqParameter('q',$event.target.value)" @wheel="wheelEqParameter($event,'q')"></label></div>
