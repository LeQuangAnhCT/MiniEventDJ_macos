<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>MiniEventDJ</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;font-family:"Segoe UI",Arial,sans-serif;color:#fff;user-select:none}.controller{height:74px;margin:1px;padding:10px 11px;display:flex;align-items:center;gap:8px;background:#191919;border:1px solid #454545;border-radius:17px;box-shadow:0 14px 40px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.07)}.mark{width:9px;height:9px;border-radius:50%;background:#e9e9e9;box-shadow:0 0 12px rgba(255,255,255,.35)}.label{margin-right:auto;font-size:10px;font-weight:750;letter-spacing:.05em;color:#d8d8d8}.hint{display:block;margin-top:2px;color:#909090;font-size:8px;font-weight:500;letter-spacing:.03em}button{height:38px;padding:0 12px;border:1px solid #4a4a4a;border-radius:10px;background:#2a2a2a;color:#fff;font:700 10px/1 "Segoe UI",Arial,sans-serif;letter-spacing:.04em;cursor:pointer;transition:background .16s ease,color .16s ease,transform .16s ease}button:hover{background:#f0f0f0;color:#111}button:active{transform:scale(.96)}button.stop{background:#f1f1f1;color:#111;border-color:#fff}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style><script src="tauri-bridge.js"></script></head><body><main class="controller"><span class="mark"></span><div class="label">ĐIỀU KHIỂN NHANH<span class="hint">MINIEVENT DJ</span></div><button class="stop" id="toggle">DỪNG</button><button id="next">BÀI KẾ</button><button id="open">MỞ</button></main><script>const toggle=document.querySelector('#toggle');toggle.onclick=()=>window.quickControl.action('toggle');document.querySelector('#next').onclick=()=>window.quickControl.action('next');document.querySelector('#open').onclick=()=>window.quickControl.action('open');window.quickControl.onState(state=>{const playing=state.playbackState==='playing';toggle.textContent=playing?'DỪNG':'PHÁT';toggle.classList.toggle('stop',playing)});</script></body></html>
