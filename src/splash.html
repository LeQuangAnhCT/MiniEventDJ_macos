<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>MINIEVENT DJ</title><style>
:root{color-scheme:dark;--bg:#0b0b0b;--line:#383838;--text:#fff;--muted:#a3a3a3}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI Variable","Segoe UI",Arial,sans-serif}.splash{position:relative;isolation:isolate;min-height:100vh;padding:26px 30px 18px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;opacity:0;transform:scale(.985);animation:intro .48s cubic-bezier(.16,1,.3,1) forwards}.splash:before{content:"";position:absolute;z-index:-2;inset:0;background:radial-gradient(circle at 50% 48%,#252525 0,rgba(25,25,25,.48) 22%,transparent 56%)}.splash:after{content:"";position:absolute;z-index:-1;inset:12px;border:1px solid rgba(255,255,255,.035);border-radius:18px;pointer-events:none}header{display:flex;justify-content:space-between;align-items:start}.brand{font-size:14px;font-weight:780;letter-spacing:.02em}.credit{margin-top:4px;color:var(--muted);font-size:8px;font-weight:650;letter-spacing:.14em}.startup{color:var(--muted);font-size:9px;letter-spacing:.12em}.stage{display:grid;justify-items:center;align-content:center;gap:12px}.stage-title{margin:0 0 2px;font-size:24px;letter-spacing:.01em;font-weight:790}.turntable{position:relative;width:238px;height:238px;display:grid;place-items:center}.turntable:before,.turntable:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.13);border-radius:50%}.turntable:before{inset:17px;box-shadow:0 0 0 13px rgba(255,255,255,.022),0 0 0 27px rgba(255,255,255,.016)}.turntable:after{inset:31px;border-color:rgba(255,255,255,.09)}.ring{position:absolute;inset:0;width:238px;height:238px;transform:rotate(-90deg);filter:drop-shadow(0 4px 10px rgba(0,0,0,.32))}.ring circle{fill:none;stroke-width:5}.ring .track{stroke:#303030}.ring .progress{stroke:#f2f2f2;stroke-linecap:round;stroke-dasharray:666.02;stroke-dashoffset:666.02;transition:stroke-dashoffset .48s cubic-bezier(.16,1,.3,1),stroke .25s ease}.ring.is-indeterminate .progress{stroke-dasharray:94 572;animation:ring-wait 1.4s linear infinite}.flag{width:132px;height:132px;position:relative;z-index:1;border:1px solid rgba(255,255,255,.22);border-radius:31px;overflow:hidden;background:#ba121d;box-shadow:inset 0 1px 0 rgba(255,255,255,.19),0 14px 28px rgba(0,0,0,.38);opacity:0;transform:scale(.96);animation:logo-in .52s cubic-bezier(.16,1,.3,1) .14s forwards}.flag img{width:100%;height:100%;display:block;object-fit:cover}.wave{position:absolute;top:50%;display:flex;gap:5px;align-items:center;height:60px;opacity:.3;transform:translateY(-50%)}.wave.left{right:calc(50% + 116px)}.wave.right{left:calc(50% + 116px);transform:translateY(-50%) scaleX(-1)}.wave i{width:3px;height:var(--h);border-radius:99px;background:#9b9b9b}.wave i:nth-child(odd){opacity:.55}.wave i:nth-child(3n){opacity:.8}.progress-readout{display:grid;justify-items:center;gap:4px;margin-top:2px}.percent{font-size:25px;line-height:1;font-weight:740;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.status{min-height:14px;color:var(--muted);font-size:10px;font-weight:650;letter-spacing:.1em;text-transform:uppercase}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;width:min(100%,420px);margin-top:11px}.step{display:grid;gap:7px;color:#707070;font-size:9px;white-space:nowrap}.step:before{content:"";display:block;height:3px;border-radius:99px;background:#303030;transition:background .35s ease,box-shadow .35s ease}.step.done{color:#dadada}.step.done:before{background:#e7e7e7;box-shadow:0 0 10px rgba(255,255,255,.19)}footer{padding-top:15px;border-top:1px solid rgba(255,255,255,.1);color:#777;text-align:center;font-size:8px;letter-spacing:.12em}body.is-ready .splash{opacity:0;transform:scale(1.01);transition:opacity .21s ease,transform .21s ease}@keyframes intro{to{opacity:1;transform:scale(1)}}@keyframes logo-in{to{opacity:1;transform:scale(1)}}@keyframes ring-wait{to{stroke-dashoffset:-666}}@media(prefers-reduced-motion:reduce){.splash,.flag{animation:none;opacity:1;transform:none}.ring.is-indeterminate .progress{animation:none}.ring .progress{transition:none}}
</style><script src="tauri-bridge.js"></script></head><body><main class="splash"><header><div><div class="brand">MINIEVENT DJ</div><div class="credit">DESIGN BY LÊ QUANG ANH</div></div><div class="startup">KHỞI ĐỘNG</div></header><section class="stage" aria-live="polite"><h1 class="stage-title">MINIEVENT DJ</h1><div class="turntable"><div class="wave left" aria-hidden="true"><i style="--h:13px"></i><i style="--h:32px"></i><i style="--h:49px"></i><i style="--h:37px"></i><i style="--h:22px"></i><i style="--h:44px"></i><i style="--h:58px"></i><i style="--h:25px"></i><i style="--h:39px"></i></div><div class="wave right" aria-hidden="true"><i style="--h:13px"></i><i style="--h:32px"></i><i style="--h:49px"></i><i style="--h:37px"></i><i style="--h:22px"></i><i style="--h:44px"></i><i style="--h:58px"></i><i style="--h:25px"></i><i style="--h:39px"></i></div><svg id="ring" class="ring" viewBox="0 0 238 238" aria-hidden="true"><circle class="track" cx="119" cy="119" r="106"></circle><circle id="progress-ring" class="progress" cx="119" cy="119" r="106"></circle></svg><div class="flag"><img id="logo" alt="Cờ Việt Nam"></div></div><div class="progress-readout"><output class="percent" id="percent">0%</output><div class="status" id="status">ĐANG KHỞI ĐỘNG</div></div><div class="steps"><div class="step" data-step="system">Hệ thống</div><div class="step" data-step="library">Thư viện</div><div class="step" data-step="audio">Âm thanh</div><div class="step" data-step="interface">Hoàn tất</div></div></section><footer>MINIEVENT DJ · VIETNAM</footer></main><script>
const c=2*Math.PI*106,ring=document.querySelector('#ring'),arc=document.querySelector('#progress-ring'),percent=document.querySelector('#percent'),status=document.querySelector('#status');document.querySelector('#logo').src=window.splash.logoUrl;let completed=false;function update({percent:value=0,status:label='ĐANG KHỞI ĐỘNG',step,indeterminate=false}){if(completed)return;const safe=Math.max(0,Math.min(100,Number(value)||0));arc.style.strokeDasharray=c;arc.style.strokeDashoffset=c*(1-safe/100);ring.classList.toggle('is-indeterminate',!!indeterminate);percent.textContent=`${Math.round(safe)}%`;status.textContent=label;const steps=['system','library','audio','interface'],index=Math.max(0,steps.indexOf(step));steps.forEach((name,current)=>document.querySelector(`[data-step="${name}"]`).classList.toggle('done',current<=index&&!indeterminate))}window.splash.onProgress(update);window.splash.onComplete(()=>{if(completed)return;completed=true;arc.style.strokeDashoffset=0;ring.classList.remove('is-indeterminate');percent.textContent='100%';status.textContent='SẴN SÀNG';document.querySelectorAll('.step').forEach(step=>step.classList.add('done'));setTimeout(()=>document.body.classList.add('is-ready'),35)});
