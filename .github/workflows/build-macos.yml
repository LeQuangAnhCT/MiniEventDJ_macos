name: Build macOS Universal (test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm test
      - name: Build Universal DMG with ad-hoc signing
        run: npm run mac:universal -- --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Upload DMG for testing
        uses: actions/upload-artifact@v4
        with:
          name: MiniEventDJ-macOS-Universal-test
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
